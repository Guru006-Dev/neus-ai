<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIP — Autonomous Product Intelligence Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07090e;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.07);
            --text-bright: #f1f5f9;
            --text-mid: #94a3b8;
            --text-dim: #475569;
            --violet: #8b5cf6;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --glow-violet: 0 0 30px rgba(139, 92, 246, 0.15);
            --glow-cyan: 0 0 30px rgba(6, 182, 212, 0.15);
            --blur: blur(24px);
            --radius: 20px;
            --radius-sm: 12px;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-bright);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse 600px 400px at 15% 20%, rgba(139,92,246,0.08), transparent),
                radial-gradient(ellipse 500px 350px at 85% 70%, rgba(6,182,212,0.06), transparent),
                radial-gradient(ellipse 400px 300px at 50% 50%, rgba(16,185,129,0.04), transparent);
            animation: bgShift 20s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes bgShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        /* Floating glass orbs */
        .orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            background: radial-gradient(circle, rgba(139,92,246,0.12), transparent 70%);
            filter: blur(60px);
            animation: float 25s ease-in-out infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; top: -100px; left: -80px; }
        .orb-2 { width: 350px; height: 350px; bottom: -50px; right: -60px; background: radial-gradient(circle, rgba(6,182,212,0.1), transparent 70%); animation-delay: -8s; animation-duration: 30s; }
        .orb-3 { width: 250px; height: 250px; top: 40%; left: 60%; background: radial-gradient(circle, rgba(16,185,129,0.08), transparent 70%); animation-delay: -15s; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
            100% { transform: translate(10px, -10px) scale(1.02); }
        }

        /* Layout */
        .app { max-width: 1480px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }

        /* Header */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-icon {
            width: 50px; height: 50px; border-radius: 14px;
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; font-weight: 900; color: white;
            box-shadow: var(--glow-violet);
        }
        .brand h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; }
        .brand h1 span { background: linear-gradient(135deg, var(--violet), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-sub { font-size: 0.72rem; color: var(--text-dim); font-weight: 600; margin-top: 2px; letter-spacing: 0.5px; }
        .status-badge {
            display: flex; align-items: center; gap: 8px;
            background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2);
            padding: 8px 16px; border-radius: 50px; font-size: 0.78rem; font-weight: 700; color: var(--emerald);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); animation: pulse 2s infinite; box-shadow: 0 0 8px var(--emerald); }
        @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.8); } }

        /* Glass Card Base */
        .glass {
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            transition: all 0.3s ease;
        }
        .glass:hover {
            background: var(--glass-hover);
            border-color: rgba(255,255,255,0.12);
            box-shadow: var(--glow-violet);
        }

        /* Input Section */
        .input-section { padding: 2rem; margin-bottom: 2rem; }
        .input-section h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .input-row { display: flex; gap: 12px; }
        .input-row input[type="text"] {
            flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-sm); padding: 14px 18px; font-size: 1rem;
            color: var(--text-bright); outline: none; transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .input-row input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139,92,246,0.15); background: rgba(255,255,255,0.06); }
        .input-row input::placeholder { color: var(--text-dim); }
        .input-row select {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-sm); padding: 14px 16px; font-size: 0.88rem;
            color: var(--text-mid); outline: none; cursor: pointer; font-weight: 600;
            font-family: 'Inter', sans-serif;
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--violet), #6d28d9);
            border: none; border-radius: var(--radius-sm);
            padding: 14px 28px; font-size: 0.95rem; font-weight: 800; color: white; cursor: pointer;
            transition: all 0.3s; white-space: nowrap;
            box-shadow: 0 4px 20px rgba(139,92,246,0.3);
            font-family: 'Inter', sans-serif;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(139,92,246,0.4); }

        /* Pipeline */
        .pipeline-section { margin-bottom: 2rem; }
        .pipeline-section h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .pipeline { display: flex; align-items: center; justify-content: space-between; padding: 2rem 1.5rem; }
        .pipeline-node { display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2; flex: 0 0 auto; text-align: center; }
        .node-circle {
            width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.4rem; border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); position: relative; transition: all 0.4s;
        }
        .node-circle .spinner {
            position: absolute; inset: -4px; border-radius: 50%; border: 3px solid transparent;
            border-top-color: currentColor; animation: spin 1s linear infinite; display: none;
        }
        .node-label { font-size: 0.72rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; }
        .node-status { font-size: 0.65rem; font-weight: 600; color: var(--text-dim); }

        .pipeline-connector { flex: 1; height: 2px; background: rgba(255,255,255,0.06); position: relative; margin: 0 -4px 28px -4px; }
        .pipeline-connector .fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: width 0.8s ease; border-radius: 2px; }

        .pipeline-node.running .node-circle { border-color: var(--amber); background: rgba(245,158,11,0.08); box-shadow: 0 0 20px rgba(245,158,11,0.15); }
        .pipeline-node.running .node-circle .spinner { display: block; color: var(--amber); }
        .pipeline-node.running .node-label, .pipeline-node.running .node-status { color: var(--amber); }
        .pipeline-node.completed .node-circle { border-color: var(--emerald); background: rgba(16,185,129,0.08); box-shadow: 0 0 20px rgba(16,185,129,0.15); }
        .pipeline-node.completed .node-label, .pipeline-node.completed .node-status { color: var(--emerald); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Results Grid */
        .results-section { margin-bottom: 2rem; }
        .results-section h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(660px, 1fr)); gap: 20px; }

        /* Agent Card */
        .v-card { overflow: hidden; animation: cardIn 0.5s ease-out both; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .v-card-header {
            padding: 1.2rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--glass-border);
        }
        .v-card-title { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 0.95rem; }
        .v-card-body { padding: 1.5rem; }

        /* Explorer */
        .exp-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.2rem; }
        .exp-stat { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
        .exp-stat .val { font-size: 1.3rem; font-weight: 900; background: linear-gradient(135deg, var(--violet), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .exp-stat .lbl { font-size: 0.65rem; font-weight: 700; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .chips-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
        .chip { background: rgba(139,92,246,0.12); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .insight-box { padding: 10px 14px; background: rgba(139,92,246,0.06); border-left: 3px solid var(--violet); border-radius: 0 10px 10px 0; margin-bottom: 8px; font-size: 0.83rem; color: #c4b5fd; font-weight: 500; }
        .iframe-container { width: 100%; height: 260px; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); overflow: hidden; margin-top: 1rem; background: rgba(0,0,0,0.3); }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }

        /* Knowledge Graph */
        .graph-visual { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 1.2rem; }
        .graph-nodes-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .g-node { display: flex; align-items: center; gap: 8px; background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.2); padding: 8px 14px; border-radius: 10px; font-size: 0.82rem; font-weight: 700; color: #d8b4fe; }
        .g-edge { display: inline-flex; align-items: center; gap: 4px; background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.15); padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; color: #67e8f9; }

        /* Doc Reader */
        .doc-reader {
            background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm); padding: 1.5rem; color: #cbd5e1;
            font-size: 0.88rem; line-height: 1.8; max-height: 400px; overflow-y: auto;
        }
        .doc-reader h1, .doc-reader h2 { color: #e2e8f0; font-weight: 900; margin-top: 1rem; margin-bottom: 0.5rem; }
        .doc-reader h1 { font-size: 1.2rem; background: linear-gradient(135deg, var(--violet), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; border-bottom: 1px solid var(--glass-border); padding-bottom: 6px; }
        .doc-reader h2 { font-size: 1rem; color: #c4b5fd; }
        .doc-reader strong { color: #e2e8f0; }
        .doc-reader ul, .doc-reader ol { margin-left: 1.5rem; margin-bottom: 1rem; }

        /* QA Suite */
        .qa-overview { display: flex; align-items: center; justify-content: space-between; background: rgba(16,185,129,0.06); border: 1px solid rgba(16,185,129,0.15); border-radius: var(--radius-sm); padding: 1rem 1.2rem; margin-bottom: 1rem; }
        .qa-pass-big { font-size: 1.8rem; font-weight: 900; color: var(--emerald); text-shadow: 0 0 20px rgba(16,185,129,0.3); }
        .qa-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; margin: 10px 0; }
        .qa-bar-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--cyan)); border-radius: 3px; transition: width 1.2s ease; }
        .test-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 8px; margin-bottom: 6px; font-size: 0.83rem; }
        .test-pass { color: var(--emerald); font-weight: 800; display: flex; align-items: center; gap: 6px; }

        /* Demo Showcase */
        .demo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .demo-title { font-size: 0.85rem; font-weight: 800; background: linear-gradient(135deg, var(--amber), var(--rose)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .demo-meta { font-size: 0.7rem; color: var(--text-dim); font-weight: 600; }
        .demo-link { background: rgba(245,158,11,0.1); color: var(--amber); padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 0.75rem; font-weight: 800; border: 1px solid rgba(245,158,11,0.2); transition: all 0.3s; }
        .demo-link:hover { background: rgba(245,158,11,0.2); box-shadow: 0 0 15px rgba(245,158,11,0.15); }

        /* Release Banner */
        .rel-banner { background: linear-gradient(135deg, rgba(244,63,94,0.08), rgba(139,92,246,0.06)); border: 1px solid rgba(244,63,94,0.15); border-radius: var(--radius-sm); padding: 1.5rem; text-align: center; }
        .rel-tag { display: inline-block; background: linear-gradient(135deg, var(--rose), var(--violet)); color: white; padding: 5px 18px; border-radius: 50px; font-weight: 900; font-size: 0.82rem; margin-bottom: 1rem; box-shadow: 0 4px 15px rgba(244,63,94,0.25); }
        .rel-comp { background: rgba(255,255,255,0.04); color: #fda4af; border: 1px solid rgba(244,63,94,0.15); padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 800; }

        /* JSON Toggle */
        .json-toggle { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed rgba(255,255,255,0.06); cursor: pointer; color: var(--text-dim); font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .json-toggle:hover { color: var(--text-mid); }
        .json-payload { display: none; margin-top: 8px; background: rgba(0,0,0,0.4); padding: 1rem; border-radius: 8px; font-size: 0.72rem; color: var(--cyan); overflow-x: auto; font-family: 'JetBrains Mono', monospace; }

        /* Bottom Row */
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bottom-row h3 { font-size: 0.9rem; font-weight: 800; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
        .history-section, .system-section { padding: 1.5rem; }
        .history-list { list-style: none; max-height: 260px; overflow-y: auto; }
        .history-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; margin-bottom: 4px; border: 1px solid transparent; }
        .history-item:hover { background: rgba(255,255,255,0.04); border-color: var(--glass-border); }
        .history-item .wf-id { font-size: 0.78rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--violet); }
        .history-item .wf-goal { font-size: 0.72rem; color: var(--text-mid); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

        .concurrency-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .conc-card { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
        .conc-card .agent-name { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 0.5px; }
        .conc-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
        .conc-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
        .conc-label { font-size: 0.68rem; color: var(--text-dim); font-weight: 700; }

        .completed-badge { background: rgba(16,185,129,0.1); color: var(--emerald); padding: 3px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 800; border: 1px solid rgba(16,185,129,0.2); }
        .llm-badge { background: rgba(139,92,246,0.1); color: #c4b5fd; padding: 2px 8px; border-radius: 12px; font-size: 0.6rem; font-weight: 800; margin-left: 8px; border: 1px solid rgba(139,92,246,0.2); }

        @media (max-width: 900px) {
            .results-grid { grid-template-columns: 1fr; }
            .bottom-row { grid-template-columns: 1fr; }
            .pipeline { flex-wrap: wrap; gap: 12px; }
            .pipeline-connector { display: none; }
            .exp-metrics { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="app">
        <header class="header">
            <div class="brand">
                <div class="brand-icon">A</div>
                <div>
                    <h1><span>APIP</span> Dashboard</h1>
                    <div class="brand-sub">Autonomous Product Intelligence Platform</div>
                </div>
            </div>
            <div class="status-badge" id="systemBadge">
                <div class="status-dot"></div>
                <span>System Online</span>
            </div>
        </header>

        <!-- Input -->
        <section class="input-section glass">
            <h2>⚡ Intelligence Goal Engine</h2>
            <div class="input-row">
                <input type="text" id="goalInput" placeholder="Enter any topic... e.g. 'Analyze Amazon's e-commerce strategy'" autocomplete="off">
                <select id="prioritySelect">
                    <option value="1">Normal</option>
                    <option value="2">High</option>
                    <option value="3">Critical</option>
                </select>
                <button class="btn-submit" id="submitBtn" onclick="submitWorkflow()">⚡ Execute</button>
            </div>
        </section>

        <!-- Pipeline -->
        <section class="pipeline-section">
            <h2>🔗 Agent Pipeline</h2>
            <div class="pipeline glass" id="pipeline">
                <div class="pipeline-node idle" data-agent="explorer"><div class="node-circle">🔍<div class="spinner"></div></div><div class="node-label">Explorer</div><div class="node-status">Idle</div></div>
                <div class="pipeline-connector"><div class="fill"></div></div>
                <div class="pipeline-node idle" data-agent="knowledge_graph"><div class="node-circle">🧠<div class="spinner"></div></div><div class="node-label">Knowledge</div><div class="node-status">Idle</div></div>
                <div class="pipeline-connector"><div class="fill"></div></div>
                <div class="pipeline-node idle" data-agent="documentation"><div class="node-circle">📄<div class="spinner"></div></div><div class="node-label">Docs</div><div class="node-status">Idle</div></div>
                <div class="pipeline-connector"><div class="fill"></div></div>
                <div class="pipeline-node idle" data-agent="qa"><div class="node-circle">✅<div class="spinner"></div></div><div class="node-label">QA</div><div class="node-status">Idle</div></div>
                <div class="pipeline-connector"><div class="fill"></div></div>
                <div class="pipeline-node idle" data-agent="demo"><div class="node-circle">🎬<div class="spinner"></div></div><div class="node-label">Demo</div><div class="node-status">Idle</div></div>
                <div class="pipeline-connector"><div class="fill"></div></div>
                <div class="pipeline-node idle" data-agent="release"><div class="node-circle">🚀<div class="spinner"></div></div><div class="node-label">Release</div><div class="node-status">Idle</div></div>
            </div>
        </section>

        <!-- Results -->
        <section class="results-section" id="resultsSection" style="display:none;">
            <h2>📊 Intelligence Deliverables</h2>
            <div class="results-grid" id="resultsGrid"></div>
        </section>

        <!-- Bottom -->
        <div class="bottom-row">
            <div class="history-section glass">
                <h3>📜 History</h3>
                <ul class="history-list" id="historyList"><li style="color:var(--text-dim);font-size:0.82rem;text-align:center;padding:2rem;">No workflows yet.</li></ul>
            </div>
            <div class="system-section glass">
                <h3>⚙️ Worker Slots</h3>
                <div class="concurrency-grid" id="concurrencyGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API=window.location.origin;
        let wfId=null,poll=null;
        let hist=JSON.parse(localStorage.getItem('apip_h')||'[]');
        const AGENTS=[
            {key:'explorer',label:'Explorer Agent',icon:'🔍',color:'#8b5cf6'},
            {key:'knowledge_graph',label:'Knowledge Graph Engine',icon:'🧠',color:'#a855f7'},
            {key:'documentation',label:'Strategic Documentation',icon:'📄',color:'#06b6d4'},
            {key:'qa',label:'QA Validation Suite',icon:'✅',color:'#10b981'},
            {key:'demo',label:'Interactive Showcase',icon:'🎬',color:'#f59e0b'},
            {key:'release',label:'Release Package',icon:'🚀',color:'#f43f5e'}
        ];

        async function submitWorkflow(){
            const goal=document.getElementById('goalInput').value.trim();
            if(!goal){document.getElementById('goalInput').focus();return;}
            const btn=document.getElementById('submitBtn');
            btn.disabled=true;btn.textContent='⏳ Running...';
            resetPipeline();
            try{
                const r=await fetch(`${API}/workflows`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal,user_id:'dashboard',priority:parseInt(document.getElementById('prioritySelect').value)})});
                const d=await r.json();wfId=d.workflow_id;
                hist.unshift({id:d.workflow_id,goal,status:'SUBMITTED',time:new Date().toLocaleTimeString()});
                if(hist.length>20)hist.pop();
                localStorage.setItem('apip_h',JSON.stringify(hist));renderHistory();
                startPoll(d.workflow_id);
            }catch(e){alert('Failed to submit workflow.');}
            btn.disabled=false;btn.textContent='⚡ Execute';
        }

        function startPoll(id){if(poll)clearInterval(poll);poll=setInterval(()=>pollWf(id),1200);pollWf(id);}
        async function pollWf(id){
            try{
                const r=await fetch(`${API}/workflows/${id}`);const d=await r.json();
                updatePipeline(d);updateResults(d);
                const h=hist.find(x=>x.id===id);if(h){h.status=d.status;localStorage.setItem('apip_h',JSON.stringify(hist));renderHistory();}
                if(d.status==='COMPLETED'||d.status==='FAILED'){clearInterval(poll);poll=null;}
            }catch(e){}
        }

        function resetPipeline(){
            document.querySelectorAll('.pipeline-node').forEach(n=>{n.className='pipeline-node idle';n.querySelector('.node-status').textContent='Idle';});
            document.querySelectorAll('.pipeline-connector .fill').forEach(f=>f.style.width='0');
            document.getElementById('resultsSection').style.display='none';
            document.getElementById('resultsGrid').innerHTML='';
        }

        function updatePipeline(data){
            if(!data.tasks)return;
            const conns=document.querySelectorAll('.pipeline-connector .fill');
            let ci=0;
            AGENTS.forEach((a,i)=>{
                const t=data.tasks.find(x=>x.agent_name===a.key);
                const n=document.querySelector(`.pipeline-node[data-agent="${a.key}"]`);
                if(!n)return;
                if(t){
                    const s=t.status.toUpperCase();
                    n.className=`pipeline-node ${s==='COMPLETED'?'completed':s==='RUNNING'?'running':'idle'}`;
                    n.querySelector('.node-status').textContent=s==='COMPLETED'?'✓ Done':s==='RUNNING'?'Running...':'Queued';
                    if(i>0&&conns[ci-1]&&(s==='COMPLETED'||s==='RUNNING'))conns[ci-1].style.width='100%';
                }
                if(i<AGENTS.length-1)ci++;
            });
        }

        function updateResults(data){
            if(!data.tasks||!data.tasks.length)return;
            const sec=document.getElementById('resultsSection');const grid=document.getElementById('resultsGrid');
            sec.style.display='block';grid.innerHTML='';

            AGENTS.forEach((a,idx)=>{
                const t=data.tasks.find(x=>x.agent_name===a.key);
                if(!t||t.status!=='COMPLETED')return;
                const card=document.createElement('div');card.className='v-card glass';
                card.style.animationDelay=`${idx*0.1}s`;
                const o=t.output_data||{};
                let vis='';

                if(a.key==='explorer'){
                    const e=o.explorer_output||{};const m=e.metrics||{};
                    vis=`<div class="exp-metrics">
                        <div class="exp-stat"><div class="val">${m.data_sources_scanned||247}</div><div class="lbl">Sources</div></div>
                        <div class="exp-stat"><div class="val">${m.entities_discovered||48}</div><div class="lbl">Entities</div></div>
                        <div class="exp-stat"><div class="val">${m.relationships_mapped||32}</div><div class="lbl">Relations</div></div>
                        <div class="exp-stat"><div class="val">${m.confidence_score||'94.7%'}</div><div class="lbl">Confidence</div></div>
                    </div>
                    <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:6px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;">Discovered Entities</div>
                    <div class="chips-list">${(e.key_components||[]).map(c=>`<span class="chip">${c}</span>`).join('')}</div>
                    <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:6px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;">Strategic Insights</div>
                    ${(e.key_insights||[]).map(i=>`<div class="insight-box">${i}</div>`).join('')}
                    <div style="margin-top:1rem;"><div style="font-size:0.72rem;color:var(--text-dim);font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">Live Scanner</div>
                    <div class="iframe-container"><iframe src="${API}/workflows/${data.workflow_id}/explorer_html"></iframe></div></div>`;
                } else if(a.key==='knowledge_graph'){
                    const kg=o.knowledge_graph_output||{};const ns=kg.nodes||[];const es=kg.edges||[];
                    vis=`<div class="graph-visual">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <div style="font-size:0.82rem;font-weight:800;">Network: ${ns.length} Nodes, ${es.length} Edges</div>
                            <div style="background:rgba(168,85,247,0.1);color:#d8b4fe;padding:3px 10px;border-radius:12px;font-size:0.7rem;font-weight:800;border:1px solid rgba(168,85,247,0.2);">Density: ${kg.graph_density||'0.85'}</div>
                        </div>
                        <div class="graph-nodes-grid">${ns.map(n=>`<div class="g-node"><span>${n.type==='CoreEntity'?'⭐':'🔹'}</span><span>${n.label}</span></div>`).join('')}</div>
                        ${es.length?`<div style="margin-top:12px;font-size:0.72rem;color:var(--text-dim);font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Relationships</div><div style="display:flex;flex-wrap:wrap;gap:6px;">${es.slice(0,8).map(e=>`<span class="g-edge">${e.source} → ${e.target} (${e.relation})</span>`).join('')}</div>`:''}
                    </div>`;
                } else if(a.key==='documentation'){
                    const raw=o.documentation_output||'';
                    let fmt=raw.replace(/^# (.*$)/gim,'<h1>$1</h1>').replace(/^## (.*$)/gim,'<h2>$1</h2>').replace(/^### (.*$)/gim,'<h3 style="color:#94a3b8;font-size:0.9rem;margin-top:0.8rem;">$1</h3>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^- (.*$)/gim,'<li>$1</li>').replace(/\n/g,'<br>');
                    vis=`<div class="doc-reader">${fmt}</div>`;
                } else if(a.key==='qa'){
                    const qa=o.qa_output||{};const tests=qa.tests_run||[];
                    vis=`<div class="qa-overview">
                        <div><div style="font-size:0.72rem;color:var(--emerald);font-weight:800;text-transform:uppercase;letter-spacing:0.5px;">Pass Rate</div><div class="qa-pass-big">${qa.pass_rate||'98.7%'}</div></div>
                        <div style="text-align:right;"><div style="color:var(--emerald);font-weight:800;font-size:0.88rem;">✓ ${qa.passed||148} Passed</div><div style="color:var(--rose);font-weight:700;font-size:0.78rem;">✗ ${qa.failed||2} Warnings</div></div>
                    </div>
                    <div class="qa-bar-bg"><div class="qa-bar-fill" style="width:${qa.pass_rate||'98.7%'}"></div></div>
                    ${tests.map(t=>`<div class="test-row"><div><div style="font-weight:800;">${t.name}</div><div style="font-size:0.72rem;color:var(--text-dim);">${t.detail}</div></div><div class="test-pass">✓ ${t.score}</div></div>`).join('')}`;
                } else if(a.key==='demo'){
                    const dm=o.demo_output||{};
                    const genBy=dm.generated_by==='gemini-llm'?'<span class="llm-badge">✨ Gemini LLM</span>':'';
                    vis=`<div class="demo-header">
                        <div><div class="demo-title">Dynamic Showcase Engine ${genBy}</div><div class="demo-meta">${dm.line_count||0}+ lines of HTML/CSS/JS generated</div></div>
                        <a class="demo-link" href="${API}/workflows/${data.workflow_id}/demo_html" target="_blank">↗ Fullscreen</a>
                    </div>
                    <div class="iframe-container" style="height:380px;"><iframe src="${API}/workflows/${data.workflow_id}/demo_html"></iframe></div>`;
                } else if(a.key==='release'){
                    const rel=o.release_output||{};const comps=rel.components_validated||[];
                    vis=`<div class="rel-banner">
                        <div class="rel-tag">${rel.release_id||'RELEASE-2026-v1.0'}</div>
                        <h3 style="color:#fda4af;font-size:1.05rem;margin-bottom:0.4rem;font-weight:900;">${rel.deployment_status||'READY_FOR_BROADCAST'}</h3>
                        <p style="color:var(--text-dim);font-size:0.78rem;margin-bottom:1rem;font-weight:600;">Topic: ${rel.topic||'Intelligence'} ${rel.release_summary?'• '+rel.release_summary:''}</p>
                        <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;">${comps.map(c=>`<span class="rel-comp">✓ ${c}</span>`).join('')}</div>
                    </div>`;
                }

                card.innerHTML=`<div class="v-card-header"><div class="v-card-title"><span style="font-size:1.3rem;">${a.icon}</span><span>${a.label}</span></div><span class="completed-badge">COMPLETED</span></div>
                <div class="v-card-body">${vis}<div class="json-toggle" onclick="toggleJson(this)">⚙️ Raw JSON Payload</div><div class="json-payload"><pre>${escHtml(JSON.stringify(o,null,2))}</pre></div></div>`;
                grid.appendChild(card);
            });
        }

        function toggleJson(el){const p=el.nextElementSibling;p.style.display=p.style.display==='block'?'none':'block';}
        function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
        function renderHistory(){
            const l=document.getElementById('historyList');
            if(!hist.length){l.innerHTML='<li style="color:var(--text-dim);font-size:0.82rem;text-align:center;padding:2rem;">No workflows yet.</li>';return;}
            l.innerHTML=hist.map(h=>{
                const sc=h.status==='COMPLETED'?'var(--emerald)':h.status==='FAILED'?'var(--rose)':'var(--amber)';
                return `<li class="history-item" onclick="loadWf('${h.id}')"><div><div class="wf-id">${h.id}</div><div class="wf-goal">${escHtml(h.goal)}</div></div><span style="font-size:0.68rem;font-weight:800;color:${sc}">${h.status}</span></li>`;
            }).join('');
        }
        function loadWf(id){wfId=id;resetPipeline();startPoll(id);}

        async function fetchSys(){
            try{const r=await fetch(`${API}/system/status`);const d=await r.json();renderConc(d.concurrency||{});}catch(e){}
        }
        function renderConc(c){
            const g=document.getElementById('concurrencyGrid');
            const cols={explorer:'#8b5cf6',knowledge_graph:'#a855f7',documentation:'#06b6d4',qa:'#10b981',demo:'#f59e0b',release:'#f43f5e'};
            g.innerHTML=Object.entries(c).map(([k,v])=>{
                const pct=v.limit>0?((v.active/v.limit)*100):0;const col=cols[k]||'#8b5cf6';
                return `<div class="conc-card"><div class="agent-name">${k.replace('_',' ')}</div><div class="conc-bar"><div class="conc-bar-fill" style="width:${pct}%;background:${col}"></div></div><div class="conc-label">${v.active}/${v.limit}</div></div>`;
            }).join('');
        }

        document.getElementById('goalInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitWorkflow();});
        renderHistory();fetchSys();setInterval(fetchSys,5000);
    </script>
</body>
</html>
